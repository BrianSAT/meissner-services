<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620"><title>The Workshop: one operator, parallel racks</title><desc>Tentative merge of the Workshop rackplate and the Wild Card slide-out. One operator leans on a two-unit server rack; four fading echoes fan out behind. Reduced motion shows the final static rackplate.</desc><style>
.echo{transform-box:view-box;animation:fan 3.4s ease-out both;animation-delay:var(--delay)}
@keyframes fan{from{opacity:0;transform:translateX(var(--start))}to{opacity:var(--opacity);transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){.echo{animation:none}}
</style><defs><g id="rack" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="square" stroke-linejoin="bevel"><path d="M62 76C30 26 84-12 119 15c31-5 49 27 27 45v40l-32 36-42-29V76Z"/><path d="M74 117l-18 39c-38 12-53 43-56 79m116-104 27 30c36 13 52 40 62 74M39 214c23-22 48-6 70-1l65 10-25 35-125-4c-29-2-27-23 0-37m112 7-20-68"/><path d="M-25 261h245v51H-25Zm0 64h245v51H-25Z"/><path d="M-8 277v19m11-19v19m11-19v19m11-19v19m25-19h62v18H49Zm-57 64v19m11-19v19m11-19v19m11-19v19m25-19h62v18H49Z"/><circle cx="158" cy="285" r="5"/><circle cx="183" cy="285" r="5"/><circle cx="158" cy="349" r="5"/><circle cx="183" cy="349" r="5"/></g></defs><rect width="800" height="620" fill="#10150e"/><g color="#d4e757"><g class="echo" opacity=".16" style="--opacity:.16;--start:411px;--delay:1.25s"><use href="#rack" transform="translate(109 175) scale(.48)"/></g><g class="echo" opacity=".28" style="--opacity:.28;--start:337px;--delay:1s"><use href="#rack" transform="translate(183 158) scale(.6)"/></g><g class="echo" opacity=".46" style="--opacity:.46;--start:242px;--delay:.75s"><use href="#rack" transform="translate(278 132) scale(.74)"/></g><g class="echo" opacity=".66" style="--opacity:.66;--start:128px;--delay:.5s"><use href="#rack" transform="translate(392 95) scale(.88)"/></g><use href="#rack" transform="translate(520 65)"/></g><g fill="none" stroke="#d4e757" stroke-width="2"><path d="M30 30h52m-52 0v52M770 30h-52m52 0v52M30 590h52m-52 0v-52M770 590h-52m52 0v-52M40 469h720"/><circle cx="49" cy="488" r="4"/><circle cx="751" cy="488" r="4"/></g><g fill="#d4e757" font-family="Arial,Helvetica,sans-serif"><text x="64" y="527" font-size="46" font-weight="900" letter-spacing="-1">MEISSNER SERVICES</text><text x="66" y="557" font-size="13" letter-spacing="3">THE WORKSHOP / ONE OPERATOR. PARALLEL RESOURCES.</text></g></svg>
